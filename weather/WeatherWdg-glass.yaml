name: 天气·晴雨（透明版）
description: 蓝灰 UI 风格 · 含农历节气/逐时预报/五日预报/湿度进度条 · 数据源中国天气网（免 Key）· 默认透明 glass（壁纸透出来），可切回原版纯色 classic
author: 小龙女她爸
icon: https://raw.githubusercontent.com/SIJULY/egern-radar/main/weather-icon.png
compat_arguments:
  weatherCity: ''
  widgetStyle: 'glass'
compat_arguments_schema:
  weatherCity:
    name: 城市
    description: 要查询的城市，例如 合肥、北京、阳江；留空或填"自动"则按 IP 自动定位（模块自带直连规则）
    default_value: ''
  widgetStyle:
    name: 样式
    description: glass 透明（默认，根容器不设背景，壁纸透出来）；classic 原版纯色背景
    default_value: 'glass'
    options: ['glass', 'classic']
dns: {}
# 天气/IP 定位接口直连，不走代理（否则 IP 定位到代理出口）
rules:
  - domain_suffix:
      match: "weather.com.cn"
      policy: DIRECT
  - domain_suffix:
      match: "bilibili.com"
      policy: DIRECT
  - domain_suffix:
      match: "useragentinfo.com"
      policy: DIRECT
  - domain_suffix:
      match: "ipapi.co"
      policy: DIRECT
  - domain_suffix:
      match: "freeipapi.com"
      policy: DIRECT
scriptings:
- generic:
    name: weathercn
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/weather/WeatherWdg-glass.js
    timeout: 15
    env:
      CITY: '{{{weatherCity}}}'
      WIDGET_STYLE: '{{{widgetStyle}}}'
widgets:
- name: 天气·晴雨（透明版）
  script_name: weathercn





