name: 包裹助手

description: 打开菜鸟 App 或小程序刷一次“我的包裹”，就自动同步包裹列表：到站显示取件码、到站/签收发通知、桌面小组件显示待取和在途。登录凭证抓取默认关闭，需要后台自动刷新时再打开开关，开关要一直开着才会在后台刷新。（v16：改调小程序同款列表接口 querypackagelist.lightapp.get，之前调的 queryPdsPackageDataList 一直报 SESSION 失效）

author: pin

icon: shippingbox.fill

env_schema:

  ENABLE_COOKIE_CAPTURE:
    name: 抓取登录凭证
    description: 打开后，脚本会在你刷淘宝/菜鸟时存下登录凭证（_m_h5_tk），定时脚本就能在后台自动刷新，不用每次打开菜鸟。后台刷新只在开关开着时跑，关掉就停，所以要一直开着；关掉后也不再存任何凭证。
    options:
      - "true"
      - "false"
    default_value: "false"

  KDNIAO_EBUSINESS_ID:
    name: 快递鸟 EBusinessID
    description: 可选补充。快递鸟官网（kdniao.com）注册后在后台查看，与 AppKey 成对使用；不填则只用菜鸟列表
    default_value: ''

  KDNIAO_APP_KEY:
    name: 快递鸟 AppKey
    description: 可选补充。与 EBusinessID 成对使用；没有可用套餐时查单会失败，先在快递鸟后台确认套餐
    default_value: ''

  TRACKINGS:
    name: 运单号
    description: 可选补充。只在快递鸟兜底时用，一行一个，格式：运单号|备注，如 SF1234567890|耳机；多条用换行或分号隔开
    default_value: ''

  PHONE_LAST4:
    name: 手机号后四位
    description: 可选补充。顺丰/中通/京东快递鸟查单需要，填收件人手机号后四位；其他快递不用填
    default_value: ''

mitm:
  hostnames:
    - h5api.m.taobao.com
    - "*.cainiao.com"

scriptings:

- http_response:
    name: parcel-capture
    match: "^https://(h5api\\.m\\.taobao\\.com|[^/]*\\.cainiao\\.com)/"
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/parcel.js
    body_required: true
    timeout: 10

- schedule:
    name: parcel-refresh
    cron: "*/30 * * * *"
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/parcel.js
    timeout: 120

- generic:
    name: parcel-widget
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/parcel.js
    timeout: 30

- generic:
    name: parcel-status
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/parcel.js
    timeout: 30

widgets:

- name: 包裹助手
  script_name: parcel-widget
