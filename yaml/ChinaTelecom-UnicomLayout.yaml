name: 中国电信（联通布局）
description: 中国电信话费/流量/语音小组件（App RSA 登录 + 自动重登），联通布局样式：classic / 仪表盘 / iOS 三种版式
author: iBL3ND（数据）+ moyuzaime（布局）
icon: https://iili.io/nEufFXR.png
homepage: https://telecom.nufe.ccwu.cc
compat_arguments:
  ctPhone: ''
  ctPassword: ''
  ctDeviceId: ''
  ctShowGeneralFlow: 'true'
  ctShowDirectionalFlow: 'true'
  ctShowUsedFlow: 'false'
  ctShowUsedVoice: 'false'
  ctTitle: ''
  ctUiStyle: 'classic'
compat_arguments_schema:
  ctPhone:
    name: 手机号
    description: 中国电信手机号
    default_value: ''
  ctPassword:
    name: 服务密码
    description: 电信APP 设置 账户与安全里 获取服务密码
    default_value: ''
  ctDeviceId:
    name: 设备 ID
    description: '复制网站去浏览器打开获取设备ID  使用步骤：1.使用短信登录授权设备 2. 复制显示的设备 ID 在此填写 3.获取方式：网站 https://telecom.nufe.ccwu.cc'
    default_value: ''
  ctShowGeneralFlow:
    name: 显示通用流量
    description: 关闭则只统计定向流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowDirectionalFlow:
    name: 显示定向流量
    description: 关闭则只统计通用流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowUsedFlow:
    name: 显示已用流量
    description: 开启显示已用流量，关闭显示剩余流量
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctShowUsedVoice:
    name: 显示已用语音
    description: 开启显示已用语音，关闭显示剩余语音
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctTitle:
    name: 小组件标题
    description: 默认"中国电信"，可自定义
    default_value: ''
  ctUiStyle:
    name: 显示样式
    description: classic = 当前样式；dash = 仪表盘版（四宫格卡片）；ios = iOS 风格（圆环 + 列表）
    default_value: 'classic'
    options:
    - classic
    - dash
    - ios
scriptings:
- generic:
    name: china-telecom-unicom-layout
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/ChinaTelecom-UnicomLayout.js
    env:
      CT_PHONE: '{{{ctPhone}}}'
      CT_PASSWORD: '{{{ctPassword}}}'
      CT_DEVICE_ID: '{{{ctDeviceId}}}'
      CT_SHOW_GENERAL_FLOW: '{{{ctShowGeneralFlow}}}'
      CT_SHOW_DIRECTIONAL_FLOW: '{{{ctShowDirectionalFlow}}}'
      CT_SHOW_USED_FLOW: '{{{ctShowUsedFlow}}}'
      CT_SHOW_USED_VOICE: '{{{ctShowUsedVoice}}}'
      CT_TITLE: '{{{ctTitle}}}'
      CT_UI_STYLE: '{{{ctUiStyle}}}'
widgets:
- name: 中国电信
  script_name: china-telecom-unicom-layout
