name: 📌 全国油价 (Gas Price) 小组件 · 透明版
scriptings:
- generic:
    name: shishiyoujia-glass
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/shishiyoujia-glass.js
    env_schema:
      WIDGET_STYLE:
        type: string
        options: ["glass", "classic"]
        default: "glass"
        description: "glass 透明 / classic 原版"
widgets:
- name: 全国油价
  script_name: shishiyoujia-glass
author: 'mickeu · Egern adaptation: ErrBin'
description: 实时油价：按省份显示 92#/95#/98# 与 0# 柴油价格、较上次调整的涨跌幅；大号含历史走势图，调价前 3 天显示下轮调价预测。
icon: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/icon/gas-icon.png
