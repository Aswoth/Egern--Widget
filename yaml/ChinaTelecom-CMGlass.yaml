name: 中国电信（移动透明版）
description: 中国电信话费/流量/语音小组件（App RSA 登录 + 自动重登），移动透明版布局：dash 仪表盘 / ios iOS 风格 × glass 透明 / classic 原版
author: iBL3ND（数据）+ Hark（布局，基于 zhaohantao1360-hash 改版）
icon: https://iili.io/nEufFXR.png
homepage: https://telecom.nufe.ccwu.cc
compat_arguments:
  ctPhone: ''
  ctPassword: ''
  ctDeviceId: ''
  ctShowGeneralFlow: 'true'
  ctShowDirectionalFlow: 'true'
  ctShowUsedFlow: 'false'
  ctShowUsedVoice: 'false'
  ctTitle: ''
  ctLayout: 'dash'
  ctWidgetStyle: 'glass'
compat_arguments_schema:
  ctPhone:
    name: 手机号
    description: 中国电信手机号
    default_value: ''
  ctPassword:
    name: 服务密码
    description: 电信APP 设置 账户与安全里 获取服务密码
    default_value: ''
  ctDeviceId:
    name: 设备 ID
    description: '复制网站去浏览器打开获取设备ID  使用步骤：1.使用短信登录授权设备 2. 复制显示的设备 ID 在此填写 3.获取方式：网站 https://telecom.nufe.ccwu.cc'
    default_value: ''
  ctShowGeneralFlow:
    name: 显示通用流量
    description: 关闭则只统计定向流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowDirectionalFlow:
    name: 显示定向流量
    description: 关闭则只统计通用流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowUsedFlow:
    name: 显示已用流量
    description: 开启显示已用流量，关闭显示剩余流量
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctShowUsedVoice:
    name: 显示已用语音
    description: 开启显示已用语音，关闭显示剩余语音
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctTitle:
    name: 小组件标题
    description: 默认"中国电信"，可自定义
    default_value: ''
  ctLayout:
    name: 显示版式
    description: dash 仪表盘版（默认）/ ios iOS 风格版（圆环 + 列表）
    default_value: 'dash'
    options:
    - dash
    - ios
  ctWidgetStyle:
    name: 显示样式
    description: glass 透明（默认，根背景去掉透壁纸）/ classic 原版渐变
    default_value: 'glass'
    options:
    - glass
    - classic
scriptings:
- generic:
    name: china-telecom-cmglass
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/ChinaTelecom-CMGlass.js
    env:
      CT_PHONE: '{{{ctPhone}}}'
      CT_PASSWORD: '{{{ctPassword}}}'
      CT_DEVICE_ID: '{{{ctDeviceId}}}'
      CT_SHOW_GENERAL_FLOW: '{{{ctShowGeneralFlow}}}'
      CT_SHOW_DIRECTIONAL_FLOW: '{{{ctShowDirectionalFlow}}}'
      CT_SHOW_USED_FLOW: '{{{ctShowUsedFlow}}}'
      CT_SHOW_USED_VOICE: '{{{ctShowUsedVoice}}}'
      CT_TITLE: '{{{ctTitle}}}'
      # 布局开关与移动版同名（布局代码逐字节原样，直接读 CM_*）；CT_* 两份也同步写一份，两种写法都认
      CM_LAYOUT: '{{{ctLayout}}}'
      CT_LAYOUT: '{{{ctLayout}}}'
      CM_WIDGET_STYLE: '{{{ctWidgetStyle}}}'
      CT_WIDGET_STYLE: '{{{ctWidgetStyle}}}'
      # 布局内部 wiring：getPhone() 读 CM_PHONENUMBER 显示掩码号码；
      # insights() 读 CM_SHOW_USED_FLOW 决定是否统计今日用量
      CM_PHONENUMBER: '{{{ctPhone}}}'
      CM_SHOW_USED_FLOW: '{{{ctShowUsedFlow}}}'
widgets:
- name: 中国电信
  script_name: china-telecom-cmglass
