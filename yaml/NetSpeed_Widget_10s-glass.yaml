# Source: https://raw.githubusercontent.com/BiaoerD/Enern-/main/NetSpeed_Widget_10s.js
# Author: BiaoerD
# Glass fork: 透明版（WIDGET_STYLE 开关，glass 默认透明 / classic 原版）
name: NetSpeed 10s 测速 · 透明版
description: 持续测速 10 秒：每秒记录一次速度，结束后显示平均值与逐秒数据；节点信息整合 IPPure（国家城市、运营商、住宅原生、IP 风险评分）。
icon: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/icon/NetSpeed-Icon.png
author: BiaoerD

env_schema:
  WIDGET_STYLE:
    name: "样式"
    description: "glass 透明（默认）/ classic 原版"
    default_value: "glass"
    options: ["glass", "classic"]
  GROUP:
    name: "IPPure 策略组"
    description: "IPPure 节点查询走的策略组；默认先按规则路由，失败后强制走该策略重试"
    default_value: "Proxy"

scriptings:
- generic:
    name: netspeed-10s-glass
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/NetSpeed_Widget_10s-glass.js
    timeout: 30
    env:
      GROUP: "Proxy"

widgets:
- name: 网速测速
  script_name: netspeed-10s-glass
