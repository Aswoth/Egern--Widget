name: 中国联通（移动透明版）
description: 中国联通话费/流量/语音小组件（App/小程序抓取 + 自动重放），移动透明版布局：dash 仪表盘 / ios iOS 风格 × glass 透明 / classic 原版
author: moyuzaime（数据）+ Hark（布局，基于 zhaohantao1360-hash 改版）
icon: https://iili.io/nEuB6Jt.png
homepage: https://github.com/moyuzaime/egern/tree/main/ChinaUnicom
compat_arguments:
  cuCapture: 'true'
  cuCaptureNotice: 'true'
  cuPlanNotice: 'true'
  cuMiniCapture: 'true'
  cuDebug: 'false'
  cuShowGeneralFlow: 'true'
  cuShowDirectionalFlow: 'true'
  cuShowUsedFlow: 'false'
  cuShowUsedVoice: 'false'
  cuTitle: ''
  cuLayout: 'dash'
  cuWidgetStyle: 'glass'
compat_arguments_schema:
  cuCapture:
    name: 中国联通数据抓取
    description: 监听联通 App 请求（m.client.10010.com）；关闭后 App 侧不写入任何数据
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuMiniCapture:
    name: 微信小程序数据抓取
    description: 监听微信「中国联通」小程序的首页接口与「余量查询」页（mina / mxx），解析通用流量、其他流量、语音及账户余额/本月消费/结转/欠费，并保存小程序请求凭据。没有 App 凭据时，组件会原样重放这些请求自行取数。关闭后既不解析也不重放
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuCaptureNotice:
    name: 数据捕获成功通知
    description: 捕获到 App 登录信息或小程序套餐数据时发送通知
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuPlanNotice:
    name: 套餐查询成功通知
    description: 联通接口成功返回后通知当前话费、流量和语音余量
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuDebug:
    name: 调试日志
    description: 打开后会在脚本日志里打印接口响应结构与关键字段（不含手机号/票据），用于排查字段变化；平时保持关闭
    default_value: 'false'
    options:
      - 'true'
      - 'false'
  cuShowGeneralFlow:
    name: 显示通用流量
    description: 流量统计包含通用流量（关闭则只统计定向流量）
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuShowDirectionalFlow:
    name: 显示定向流量
    description: 流量统计包含定向流量，并单独显示一行定向余量（关闭则只统计通用流量）
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuShowUsedFlow:
    name: 显示已用流量
    description: 开启显示已用流量，关闭显示剩余流量
    default_value: 'false'
    options:
      - 'true'
      - 'false'
  cuShowUsedVoice:
    name: 显示已用语音
    description: 开启显示已用语音，关闭显示剩余语音
    default_value: 'false'
    options:
      - 'true'
      - 'false'
  cuTitle:
    name: 小组件标题
    description: 默认"中国联通"，可自定义
    default_value: ''
  cuLayout:
    name: 显示版式
    description: dash 仪表盘版（默认）/ ios iOS 风格版（圆环 + 列表）
    default_value: 'dash'
    options:
      - dash
      - ios
  cuWidgetStyle:
    name: 显示样式
    description: glass 透明（默认，根背景去掉透壁纸）/ classic 原版渐变
    default_value: 'glass'
    options:
      - glass
      - classic
scriptings:
  - generic:
      name: china-lt
      script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/ChinaLT.js
      update_interval: 21600
      timeout: 20
      env:
        cuCapture: '{{{cuCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'
        cuDebug: '{{{cuDebug}}}'
        cuPlanNotice: '{{{cuPlanNotice}}}'
        cuMiniCapture: '{{{cuMiniCapture}}}'
        CU_SHOW_GENERAL_FLOW: '{{{cuShowGeneralFlow}}}'
        CU_SHOW_DIRECTIONAL_FLOW: '{{{cuShowDirectionalFlow}}}'
        CU_SHOW_USED_FLOW: '{{{cuShowUsedFlow}}}'
        CU_SHOW_USED_VOICE: '{{{cuShowUsedVoice}}}'
        CU_TITLE: '{{{cuTitle}}}'
        # 布局开关与移动版同名（布局代码逐字节原样，直接读 CM_*）；CU_* 两份也同步写一份，两种写法都认
        CM_LAYOUT: '{{{cuLayout}}}'
        CU_LAYOUT: '{{{cuLayout}}}'
        CM_WIDGET_STYLE: '{{{cuWidgetStyle}}}'
        CU_WIDGET_STYLE: '{{{cuWidgetStyle}}}'
        # 布局内部 wiring：insights() 读 CM_SHOW_USED_FLOW 决定是否统计今日用量；
        # getPhone() 读 CM_PHONENUMBER 显示掩码号码，联通手机号来自抓取，loadData
        # 会把 unicom_phone 桥接到 cm_phone_backup，env 这里不用填
        CM_SHOW_USED_FLOW: '{{{cuShowUsedFlow}}}'

  - http_request:
      name: 中国联通 App 请求侦察
      match: '^https://m\.client\.10010\.com/'
      script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/ChinaLT.js
      body_required: false
      max_size: 1048576
      timeout: 10
      env:
        cuCapture: '{{{cuCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'
        cuDebug: '{{{cuDebug}}}'
        cuPlanNotice: '{{{cuPlanNotice}}}'

  - http_request:
      name: 中国联通小程序请求捕获
      # 保存小程序请求凭据（URL + 关键请求头 + 原始 body），供组件在没有 App 凭据时原样重放。
      # body_required 必须为 true，否则拿不到小程序接口的密文请求体。
      match: '^https://(mina\.10010\.com/wxapplet/weixinNew/|mxx\.client\.10010\.com/(?:servicequerybusiness|servicebusiness)/)'
      script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/ChinaLT.js
      body_required: true
      max_size: 1048576
      timeout: 10
      env:
        cuMiniCapture: '{{{cuMiniCapture}}}'

  - http_response:
      name: 中国联通小程序响应解析
      # mina：小程序自有接口（首页大球/手机号/账户）；mxx：小程序里的「余量查询」webview，字段最全。
      # 只匹配业务接口路径（不给整个 mxx 域缓冲响应体）；脚本再按字段识别：curntbalancecust 走账户、packageName+resources 走余量明细，非 JSON 直接跳过。
      match: '^https://(mina\.10010\.com/wxapplet/weixinNew/|mxx\.client\.10010\.com/(?:servicequerybusiness|servicebusiness)/)'
      script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/ChinaLT.js
      body_required: true
      max_size: 1048576
      timeout: 10
      env:
        cuMiniCapture: '{{{cuMiniCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'

mitm:
  hostnames:
    includes:
      - m.client.10010.com
      - mina.10010.com
      - mxx.client.10010.com

widgets:
  - name: 中国联通
    script_name: china-lt
