name: Egern「网络诊断雷达」（透明版）
scriptings:
- generic:
    name: wangluozhenduanleida
    script_url: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/js/wangluozhenduanleida-glass.js
widgets:
- name: 网络诊断雷达（透明版）
  script_name: wangluozhenduanleida
env_schema:
  AI:
    name: AI 策略
    description: AI 服务解锁检测用的策略组；POLICY 为空时生效，留空自动匹配
  LMT:
    name: 流媒体策略
    description: 流媒体解锁检测用的策略组；POLICY 为空时生效，留空自动匹配
  POLICY:
    name: 代理策略
    description: 最高优先级；指定后出口、延迟、UDP/QUIC、流媒体、AI 全部统一走该策略；留空用默认规则
  XY:
    name: 强制协议
    description: 手动指定协议，如 VLESS / Trojan / HY2 / AnyTLS；留空自动识别
  YS:
    name: 隐藏 IP
    description: 填 1 隐藏 IP 地址（如 123.123.123.123 显示为 123.123.*.*）；填 0 或留空不隐藏
  WIDGET_STYLE:
    name: 样式（glass 透明 / classic 原版）
    description: glass 透明（默认，根容器不设背景，卡片/磁贴半透明）；classic 原版纯色背景
    options: ["glass", "classic"]
    default_value: 'glass'
author: 'lylywayr · Egern adaptation: ErrBin'
description: 实时诊断网络状态：当前代理出口、延迟与协议，本地网络与 DNS，流媒体解锁与 AI 解锁检测，IP 纯净评分与风险等级。
icon: https://raw.githubusercontent.com/Aswoth/Egern--Widget/main/icon/Radar-Icon.png
